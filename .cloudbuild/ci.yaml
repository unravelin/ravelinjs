# yaml-language-server: $schema=https://json.schemastore.org/cloudbuild.json
tags:
  - ravelinjs

substitutions:
  _NODE: node:24.20.0-alpine

availableSecrets:
  secretManager:
    - versionName: projects/ravelin-builds/secrets/ci-browserstack-token/versions/latest
      env: BROWSERSTACK_ACCESS_KEY
    - versionName: projects/ravelin-builds/secrets/ci-browserstack-username/versions/latest
      env: BROWSERSTACK_USERNAME
    - versionName: projects/ravelin-builds/secrets/ci-ngrok-token/versions/latest
      env: NGROK_AUTHTOKEN
    - versionName: projects/ravelin-builds/secrets/github-token/versions/latest
      env: GITHUB_TOKEN

logsBucket: gs://ravelin-cloudbuild-logs
options:
  logging: GCS_ONLY
  pool:
    name: projects/ravelin-builds/locations/europe-west1/workerPools/c3-highcpu-8

steps:
  - id: mkcert
    waitFor: ["-"]
    name: $_NODE
    env:
      - CAROOT=/workspace/certs
    script: |
      #! /usr/bin/env sh
      set -e
      mkdir ./certs
      apk add mkcert --no-cache --repository=http://dl-cdn.alpinelinux.org/edge/testing/
      mkcert -install
      cd ./certs
      mkcert localhost

  - id: install
    waitFor: ["-"]
    name: $_NODE
    entrypoint: npm
    env:
      - HUSKY=0
    args:
      - ci

  - id: build
    waitFor: ["install"]
    name: $_NODE
    entrypoint: npm
    args:
      - run
      - build

  - id: import_tests
    waitFor: ["mkcert", "build"]
    name: $_NODE
    entrypoint: npm
    args:
      - run
      - test:import

  - id: bot_tests
    waitFor: ["import_tests"]
    name: $_NODE
    entrypoint: npm
    args:
      - run
      - test:bot

  - id: browserstack
    waitFor: ["import_tests", "bot_tests"]
    name: $_NODE
    entrypoint: npm
    env:
      - HEAD_BRANCH=$_HEAD_BRANCH
      - COMMIT_SHA=$COMMIT_SHA
      - BUILD_ID=$BUILD_ID
      - HEAD_REPO_URL=$_HEAD_REPO_URL
      - NODE_EXTRA_CA_CERTS=/workspace/certs/rootCA.pem
    secretEnv:
      - BROWSERSTACK_ACCESS_KEY
      - BROWSERSTACK_USERNAME
      - NGROK_AUTHTOKEN
      - GITHUB_TOKEN
    args:
      - run
      - test:integration
